<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardDrop" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="440" rx="16" fill="url(#shieldBg)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="40" y="24" width="150" height="26" rx="13" fill="#0f172a"/>
  <text x="115" y="42" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="bold" fill="#ffffff">v1.1.0 ROBUSTNESS</text>
  <text x="206" y="43" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="bold" fill="#0f172a">六重工程鲁棒性防线（Six-Layer Production Robustness Architecture）</text>

  <!-- Row 1, Card 1 -->
  <g filter="url(#cardDrop)" transform="translate(40, 72)">
    <rect width="356" height="162" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="18" y="16" width="28" height="28" rx="7" fill="#0f172a"/>
    <text x="32" y="35" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">01</text>
    <text x="56" y="36" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15.5" font-weight="bold" fill="#0f172a">语境感知文风门禁与可插拔词库</text>
    <text x="18" y="66" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#334155">• 自动豁免双引号“……”与 &gt; 块引用内的受访者原话</text>
    <text x="18" y="90" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#334155">• 词表外置至 configs/prose_rules.json 解耦维护</text>
    <text x="18" y="114" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#334155">• 支持 --profile core,historical 学科词库按需切换</text>
    <rect x="18" y="128" width="214" height="22" rx="5" fill="#f1f5f9"/>
    <text x="26" y="143" font-family="Consolas,monospace" font-size="11" fill="#0f172a">audit_report_prose.py --profile core</text>
  </g>

  <!-- Row 1, Card 2 -->
  <g filter="url(#cardDrop)" transform="translate(422, 72)">
    <rect width="356" height="162" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="18" y="16" width="28" height="28" rx="7" fill="#1e3a8a"/>
    <text x="32" y="35" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">02</text>
    <text x="56" y="36" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15.5" font-weight="bold" fill="#0f172a">宽表自动横向分节与双层跨列表头</text>
    <text x="18" y="66" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#334155">• ≥7 列宽表或 &lt;!-- landscape --&gt; 自动切横向 A4 页</text>
    <text x="18" y="90" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#334155">• 表后正文自动恢复纵向 A4，零多余空白页</text>
    <text x="18" y="114" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#334155">• 原生支持 &gt; 跨列合并表头 + 0.5pt 栏目子线 (cmidrule)</text>
    <rect x="18" y="128" width="250" height="22" rx="5" fill="#eff6ff"/>
    <text x="26" y="143" font-family="Consolas,monospace" font-size="11" fill="#1e3a8a">w:orient=&quot;landscape&quot; + w:gridSpan</text>
  </g>

  <!-- Row 1, Card 3 -->
  <g filter="url(#cardDrop)" transform="translate(804, 72)">
    <rect width="356" height="162" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="18" y="16" width="28" height="28" rx="7" fill="#065f46"/>
    <text x="32" y="35" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">03</text>
    <text x="56" y="36" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15.5" font-weight="bold" fill="#0f172a">学术插图自适应引擎（表上、图下）</text>
    <text x="18" y="66" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#334155">• 超宽大图自动等比限宽 ≤14.5 cm，严防撑破页边距</text>
    <text x="18" y="90" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#334155">• 自动清零图片段首行缩进，消除“右偏 2 字符”顽疾</text>
    <text x="18" y="114" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#334155">• 强制校验“图 X”位于图正下方并锁定 keepNext 防拆散</text>
    <rect x="18" y="128" width="236" height="22" rx="5" fill="#ecfdf5"/>
    <text x="26" y="143" font-family="Consolas,monospace" font-size="11" fill="#065f46">wp:extent ≤ 5,220,000 EMU + SVG</text>
  </g>

  <!-- Row 2, Card 4 -->
  <g filter="url(#cardDrop)" transform="translate(40, 254)">
    <rect width="356" height="162" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="18" y="16" width="28" height="28" rx="7" fill="#4338ca"/>
    <text x="32" y="35" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">04</text>
    <text x="56" y="36" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15.5" font-weight="bold" fill="#0f172a">既有 .docx 一键重排与文件锁保护</text>
    <text x="18" y="66" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#334155">• --restyle 直接清洗已有杂乱 Word（无需转回 MD）</text>
    <text x="18" y="90" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#334155">• 一键剥离蓝字标题、灰底纹、网格竖线，统一宋体纯黑</text>
    <text x="18" y="114" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#334155">• 检测 Word/WPS ~$ 占用锁，自动安全写入 *_updated.docx</text>
    <rect x="18" y="128" width="256" height="22" rx="5" fill="#eef2ff"/>
    <text x="26" y="143" font-family="Consolas,monospace" font-size="11" fill="#4338ca">md_to_academic_docx.py messy.docx --restyle</text>
  </g>

  <!-- Row 2, Card 5 -->
  <g filter="url(#cardDrop)" transform="translate(422, 254)">
    <rect width="356" height="162" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="18" y="16" width="28" height="28" rx="7" fill="#9a3412"/>
    <text x="32" y="35" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">05</text>
    <text x="56" y="36" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15.5" font-weight="bold" fill="#0f172a">实证数字表文交叉对账门禁</text>
    <text x="18" y="66" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#334155">• 内置表文一致性核验：自动拦截系数正负号反转错误</text>
    <text x="18" y="90" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#334155">• 精准捕获高精度回归系数与样本量 N 的抄写移位笔误</text>
    <text x="18" y="114" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#334155">• 支持 --data-source 绑定 JSON/CSV 统计真值逐项对账</text>
    <rect x="18" y="128" width="272" height="22" rx="5" fill="#fff7ed"/>
    <text x="26" y="143" font-family="Consolas,monospace" font-size="11" fill="#9a3412">verify_numbers.py --data-source res.json</text>
  </g>

  <!-- Row 2, Card 6 -->
  <g filter="url(#cardDrop)" transform="translate(804, 254)">
    <rect width="356" height="162" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="18" y="16" width="28" height="28" rx="7" fill="#0f172a"/>
    <text x="32" y="35" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">06</text>
    <text x="56" y="36" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15.5" font-weight="bold" fill="#0f172a">零 Pandoc 原生公式与三端自动化 CI</text>
    <text x="18" y="66" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#334155">• 纯 Python 递归解析 LaTeX 直出原生 Word &lt;m:oMath&gt;</text>
    <text x="18" y="90" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#334155">• 完整支持分式、根号、求和积分限、希腊字母与重音符</text>
    <text x="18" y="114" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#334155">• GitHub Actions 覆盖 Win / macOS / Linux 全量回归测试</text>
    <rect x="18" y="128" width="252" height="22" rx="5" fill="#f1f5f9"/>
    <text x="26" y="143" font-family="Consolas,monospace" font-size="11" fill="#0f172a">latex_to_omml.py + 3-OS Matrix CI</text>
  </g>
</svg>
