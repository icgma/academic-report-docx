<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <rect width="1200" height="320" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="600" y="36" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="19.5" font-weight="bold" fill="#0f172a">五大智能体统一适配架构与三阶段闭环编译流水线</text>

  <!-- Left: 5 Agents Stack -->
  <g transform="translate(36, 62)" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12.5">
    <rect x="0" y="0" width="250" height="38" rx="7" fill="#f8fafc" stroke="#0f172a" stroke-width="1.3"/>
    <text x="14" y="24" font-weight="bold" fill="#0f172a">Claude Code</text>
    <text x="238" y="24" text-anchor="end" font-size="11" fill="#475569">~/.claude/skills/</text>

    <rect x="0" y="47" width="250" height="38" rx="7" fill="#f8fafc" stroke="#0f172a" stroke-width="1.3"/>
    <text x="14" y="71" font-weight="bold" fill="#0f172a">OpenAI Codex</text>
    <text x="238" y="71" text-anchor="end" font-size="11" fill="#475569">~/.codex/skills/ + openai.yaml</text>

    <rect x="0" y="94" width="250" height="38" rx="7" fill="#f8fafc" stroke="#0f172a" stroke-width="1.3"/>
    <text x="14" y="118" font-weight="bold" fill="#0f172a">dsh (DeepSeek Harness)</text>
    <text x="238" y="118" text-anchor="end" font-size="11" fill="#475569">~/.dsh/skills/ (热重载)</text>

    <rect x="0" y="141" width="250" height="38" rx="7" fill="#f8fafc" stroke="#0f172a" stroke-width="1.3"/>
    <text x="14" y="165" font-weight="bold" fill="#0f172a">ZCode</text>
    <text x="238" y="165" text-anchor="end" font-size="11" fill="#475569">~/.zcode/skills/</text>

    <rect x="0" y="188" width="250" height="38" rx="7" fill="#f8fafc" stroke="#0f172a" stroke-width="1.3"/>
    <text x="14" y="212" font-weight="bold" fill="#0f172a">WorkBuddy</text>
    <text x="238" y="212" text-anchor="end" font-size="11" fill="#475569">~/.workbuddy/skills/</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="296" y1="175" x2="346" y2="175" stroke="#0f172a" stroke-width="2"/>
  <polygon points="346,170 358,175 346,180" fill="#0f172a"/>

  <!-- Stage 1 Box -->
  <g transform="translate(364, 88)">
    <rect width="236" height="174" rx="12" fill="#f8fafc" stroke="#0f172a" stroke-width="1.6"/>
    <rect x="16" y="16" width="92" height="24" rx="5" fill="#0f172a"/>
    <text x="62" y="33" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="bold" fill="#ffffff">STAGE 1</text>
    <text x="16" y="64" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="bold" fill="#0f172a">汇报文风门禁扫描</text>
    <text x="16" y="88" font-family="'Segoe UI',monospace" font-size="11.5" fill="#2563eb">audit_report_prose.py</text>
    <text x="16" y="114" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#334155">• 拦截“我/你/您”人称代词</text>
    <text x="16" y="134" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#334155">• 拦截生僻古词、AI黑话、括号英文</text>
    <text x="16" y="154" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#334155">• 核验 ≤38 字分句与表题/表注配对</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="608" y1="175" x2="648" y2="175" stroke="#0f172a" stroke-width="2"/>
  <polygon points="648,170 660,175 648,180" fill="#0f172a"/>

  <!-- Stage 2 Box -->
  <g transform="translate(666, 88)">
    <rect width="236" height="174" rx="12" fill="#f8fafc" stroke="#0f172a" stroke-width="1.6"/>
    <rect x="16" y="16" width="92" height="24" rx="5" fill="#0f172a"/>
    <text x="62" y="33" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="bold" fill="#ffffff">STAGE 2</text>
    <text x="16" y="64" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="bold" fill="#0f172a">OMML + OpenXML 精排</text>
    <text x="16" y="88" font-family="'Segoe UI',monospace" font-size="11.5" fill="#2563eb">md_to_academic_docx.py</text>
    <text x="16" y="114" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#334155">• Pandoc 渲染原生 Word 数学公式</text>
    <text x="16" y="134" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#334155">• 重写宋体 + Times New Roman 纯黑</text>
    <text x="16" y="154" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#334155">• 重塑 1.5pt/0.75pt/1.5pt 三线表</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="910" y1="175" x2="950" y2="175" stroke="#0f172a" stroke-width="2"/>
  <polygon points="950,170 962,175 950,180" fill="#0f172a"/>

  <!-- Stage 3 Box -->
  <g transform="translate(968, 88)">
    <rect width="196" height="174" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8"/>
    <rect x="16" y="16" width="92" height="24" rx="5" fill="#15803d"/>
    <text x="62" y="33" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="bold" fill="#ffffff">STAGE 3</text>
    <text x="16" y="64" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="bold" fill="#052e16">XML 断言交付验证</text>
    <text x="16" y="88" font-family="'Segoe UI',monospace" font-size="11.5" fill="#15803d">--verify 门禁通过</text>
    <text x="16" y="114" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#14532d">✓ 颜色集 == {000000}</text>
    <text x="16" y="134" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#14532d">✓ 字体 == {宋体, TNR}</text>
    <text x="16" y="154" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#14532d">✓ 三线表无竖线/无内横线</text>
  </g>
